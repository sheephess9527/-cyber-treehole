      * { box-sizing: border-box; }
      html { background: var(--page); color: var(--text); }
      body {
        margin: 0;

        flex-direction: column;

        gap: 36px;

        width: min(680px, 100%);

        border: 1px solid var(--line);

  <body>
    <div id="root"></div>
    <script>
      const storage = {
        whispers: "treehole.whispers",
        echoes: "treehole.echoes",
        letters: "treehole.letters",
        authorKey: "treehole.authorKey",
        drafts: "treehole.drafts",
        backupAt: "treehole.backupAt",
        cache: {
          whispers: "treehole.cache.whispers",
          letters:  "treehole.cache.letters",
          echoes:   "treehole.cache.echoes",
        },
      };
      const API_POSTS = "/api/posts";
      const API_MIGRATE = "/api/migrate";
      const cloudEnabled = location.protocol === "http:" || location.protocol === "https:";

      // Author mode. The key proves authorship to the backend (whisper/echo are
      // owner-only). It is stored on this device only and verified server-side —
      // a stored key just decides whether the publish forms are shown.
      function getAuthorKey() {
        try { return localStorage.getItem(storage.authorKey) || ""; } catch { return ""; }
      }
      function isAuthor() { return !!getAuthorKey(); }
      let authPrompting = false;
      // Inline login (not window.prompt) so iOS can't auto-capitalize or
      // autocorrect the key — that silently produced a wrong key and a 401.
      function promptAuthor() {
        authPrompting = true;
        renderApp();
        requestAnimationFrame(() => { const el = document.getElementById("authKeyInput"); if (el) el.focus(); });
      }
      // Confirm a key against the server before trusting it. Returns
      // { configured, ok } and never sends the key anywhere but our own API.
      async function verifyAuthorKey(key) {
        const response = await fetch(`${API_POSTS}?check=author`, {
          headers: { "Accept": "application/json", "x-author-key": key }
        });
        if (!response.ok) throw new Error("verify failed");
        return response.json();
      }
      async function submitAuthorKey() {
        const el = document.getElementById("authKeyInput");
        const value = el ? el.value.trim() : "";
        const statusEl = document.getElementById("authStatus");
        if (!value) { authPrompting = false; renderApp(); return; }
        // Verify against the server so a mismatched key is caught here, with a
        // clear message, instead of silently failing later when publishing.
        if (statusEl) statusEl.textContent = "正在验证密钥...";
        try {
          const result = await verifyAuthorKey(value);
          if (!result.configured) {
            if (statusEl) statusEl.textContent = "服务器尚未配置作者密钥（AUTHOR_KEY）。";
            return;
          }
          if (!result.ok) {
            if (statusEl) statusEl.textContent = "密钥与服务器不符，请检查后重试。";
            return;
          }
          try { localStorage.setItem(storage.authorKey, value); } catch {}
          authPrompting = false;
          renderApp();
        } catch {
          // Server unreachable — store the key anyway so offline use still works;
          // publishing will re-check when the network is back.
          try { localStorage.setItem(storage.authorKey, value); } catch {}
          authPrompting = false;
          renderApp();
        }
      }
      function cancelAuthor() { authPrompting = false; renderApp(); }
      function logoutAuthor() {
        try { localStorage.removeItem(storage.authorKey); } catch {}
        authPrompting = false;
        renderApp();
      }

      const svg = (body) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(body);
      const images = {
        entrance: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860"><rect width="1400" height="860" fill="#080706"/><rect y="500" width="1400" height="360" fill="#15120f"/><circle cx="900" cy="300" r="126" fill="#786b57" opacity=".22"/><path d="M0 492 C180 462 308 505 456 478 C626 446 746 492 890 466 C1072 430 1224 468 1400 430 L1400 860 L0 860 Z" fill="#24201a"/><path d="M0 580 C220 552 394 585 598 554 C774 526 910 582 1098 538 C1230 512 1326 520 1400 504 L1400 860 L0 860 Z" fill="#171512"/><rect y="448" width="1400" height="2" fill="#51483d" opacity=".9"/><rect y="450" width="1400" height="138" fill="url(#mist)" opacity=".86"/><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter><rect width="1400" height="860" filter="url(#grain)" opacity=".68"/><defs><linearGradient id="mist" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d8ccb8" stop-opacity=".19"/><stop offset=".5" stop-color="#8a8a8a" stop-opacity=".11"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs></svg>`),
        water: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#090807"/><rect y="220" width="1200" height="680" fill="#15120f"/><path d="M0 286 C120 258 248 296 390 274 C558 250 684 290 840 264 C998 238 1108 258 1200 240" fill="none" stroke="#665d50" stroke-width="2" opacity=".78"/><path d="M120 430 C250 412 320 446 458 424 C642 394 754 432 942 402 C1036 388 1116 392 1200 380" fill="none" stroke="#a09179" stroke-width="1" opacity=".42"/><path d="M0 578 C180 548 360 602 558 566 C732 534 902 586 1200 536" fill="none" stroke="#5a5248" stroke-width="1" opacity=".6"/><path d="M246 706 C380 696 496 720 650 698 C838 672 952 700 1082 674" fill="none" stroke="#b0a18b" stroke-width="1" opacity=".28"/><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter><rect width="1200" height="900" filter="url(#grain)" opacity=".65"/></svg>`),
        room: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#080706"/><path d="M110 90 H1090 V770 H110 Z" fill="#171512"/><path d="M110 770 H1090 L1200 900 H0 Z" fill="#0f0d0b"/><rect x="760" y="130" width="170" height="260" fill="#201c17"/><rect x="780" y="150" width="130" height="220" fill="#756957" opacity=".36"/><path d="M780 150 L362 770 H608 L910 370 V150 Z" fill="#d7cab2" opacity=".13"/><rect x="240" y="618" width="330" height="8" fill="#3c352d" opacity=".68"/><rect x="240" y="626" width="330" height="76" fill="#191611"/><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter><rect width="1200" height="900" filter="url(#grain)" opacity=".62"/></svg>`),
        field: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#080706"/><rect y="390" width="1200" height="510" fill="#15120f"/><path d="M0 394 C160 374 258 402 410 386 C598 366 730 396 900 376 C1040 360 1134 368 1200 356" fill="none" stroke="#5c5347" stroke-width="2" opacity=".82"/><g stroke="#62594c" stroke-width="1" opacity=".62"><path d="M146 840 C156 728 170 632 192 524"/><path d="M250 852 C242 730 264 624 286 506"/><path d="M430 872 C428 750 468 636 512 496"/><path d="M650 860 C626 744 664 612 708 480"/><path d="M874 868 C880 742 910 620 972 486"/><path d="M1038 850 C1018 730 1048 622 1096 510"/></g><rect y="300" width="1200" height="210" fill="url(#haze)" opacity=".72"/><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".92" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter><rect width="1200" height="900" filter="url(#grain)" opacity=".66"/><defs><linearGradient id="haze" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#c7bda9" stop-opacity=".09"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs></svg>`)
      };

      // Add default echoes if needed (you had some before)
      const defaultEchoes = [];

      let tab = "whispers";
      let activeEcho = null;
      let draftPhoto = "";
      let sharedWhispers = null;
      let sharedLetters = null;
      let sharedEchoes = null;     // 新增
      let loadingWhispers = false;
      let loadingLetters = false;
      let loadingEchoes = false;   // 新增
      let echoesError = false;     // true when the cloud echo fetch failed
      let replyingLetterId = null;
      let lettersVisible = 12;
      let migrating = false;
      function safe(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function safeImage(src) {
        if (!src) return images.entrance;
        return src.startsWith("data:") || src.startsWith("http") ? src : images.entrance;
      }

      const API_PHOTOS = "/api/photos";

      // Compress a picked photo for cloud upload. With R2 there is no 1 MB
      // content cap, so we can afford higher quality and a larger max edge.
      // Target ≤ 2 MB actual bytes (BUDGET chars × 0.75 ≈ bytes).
      function compressImage(file, maxEdge = 2400, quality = 0.88) {
        return new Promise((resolve, reject) => {
          if (!file || !file.type || !file.type.startsWith("image/")) {
            reject(new Error("not an image"));
            return;
          }
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            const BUDGET = 2666666; // ≈ 2 MB actual bytes after base64 decode
            const fits = (dataUrl) => dataUrl.length * 0.75 <= BUDGET;
            let edge = maxEdge;
            let dataUrl = "";
            for (let attempt = 0; attempt < 7; attempt++) {
              const scale = Math.min(1, edge / Math.max(img.width, img.height));
              const width = Math.max(1, Math.round(img.width * scale));
              const height = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              canvas.getContext("2d").drawImage(img, 0, 0, width, height);
              let q = quality;
              dataUrl = canvas.toDataURL("image/jpeg", q);
              while (!fits(dataUrl) && q > 0.4) {
                q = Math.round((q - 0.1) * 100) / 100;
                dataUrl = canvas.toDataURL("image/jpeg", q);
              }
              if (fits(dataUrl)) break;
              edge = Math.round(edge * 0.8);
            }
            resolve(dataUrl);
          };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode failed")); };
          img.src = url;
        });
      }

      // Convert a base64 data-URL back to a Blob so we can upload raw bytes to R2.
      function dataUrlToBlob(dataUrl) {
        const [header, b64] = dataUrl.split(",");
        const mime = (header.match(/:(.*?);/) || [])[1] || "image/jpeg";
        const bytes = atob(b64);
        const arr = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        return new Blob([arr], { type: mime });
      }

      // Upload a compressed photo (dataURL) to R2 via the worker endpoint.
      // Returns the public https:// URL on success, or throws on failure.
      async function uploadPhotoToR2(dataUrl) {
        const blob = dataUrlToBlob(dataUrl);
        const response = await fetch(API_PHOTOS, {
          method: "POST",
          headers: { "Content-Type": blob.type, "x-author-key": getAuthorKey() },
          body: blob,
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          const err = new Error(data.error || "photo upload failed");
          err.status = response.status;
          throw err;
        }
        const data = await response.json();
        return data.url;
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      // Tiny preview (~15-30KB) stored alongside the full photo. The echo list
      // ships only thumbs so the grid loads fast even on mobile Safari; the
      // full image is fetched per item when a detail is opened.
      function makeThumb(dataUrl, maxEdge = 640, quality = 0.68) {
        return new Promise((resolve) => {
          if (!dataUrl) { resolve(""); return; }
          const img = new Image();
          img.onload = () => {
            // Cap the thumb so full image + thumb + wrapper stay under the cap.
            // Step quality down, then shrink dimensions, until it fits.
            const THUMB_BUDGET = 130000;
            const fits = (d) => d.length * 0.75 <= THUMB_BUDGET;
            let edge = maxEdge;
            let out = "";
            for (let attempt = 0; attempt < 6; attempt++) {
              const scale = Math.min(1, edge / Math.max(img.width, img.height));
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              canvas.getContext("2d").drawImage(img, 0, 0, w, h);
              let q = quality;
              out = canvas.toDataURL("image/jpeg", q);
              while (!fits(out) && q > 0.4) {
                q = Math.round((q - 0.08) * 100) / 100;
                out = canvas.toDataURL("image/jpeg", q);
              }
              if (fits(out)) break;
              edge = Math.round(edge * 0.85);
            }
            resolve(out);
          };
          img.onerror = () => resolve("");
          img.src = dataUrl;
        });
      }

      async function fetchEchoImage(id, item) {
        // R2-backed echoes already have a public URL — no round-trip needed.
        if (item.image && item.image.startsWith("http")) return;
        if (!id || !cloudEnabled || item._loadingImage || item.image) return;
        item._loadingImage = true;
        try {
          const res = await fetch(`${API_POSTS}?id=${encodeURIComponent(id)}`, { headers: { "Accept": "application/json" } });
          if (res.ok) {
            const data = await res.json();
            const parsed = JSON.parse(data.post.content);
            item.image = parsed.image || item.thumb || images.entrance;
            if (tab === "echoes" && activeEcho !== null) renderEchoes();
          }
        } catch {} finally { item._loadingImage = false; }
      }

      function stamp() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }

      function day() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }

      function read(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function write(key, data) {
        try {
          localStorage.setItem(key, JSON.stringify(data));
        } catch {}
      }

      // Draft autosave: a half-written whisper / echo / letter survives an
      // accidental refresh, tab switch, or the app being backgrounded on iOS.
      function loadDraft(kind) {
        const all = read(storage.drafts, {});
        return (all && all[kind]) || {};
      }
      function saveDraft(kind, fields) {
        const all = read(storage.drafts, {});
        const hasContent = Object.values(fields).some((v) => String(v || "").trim());
        if (hasContent) all[kind] = fields; else delete all[kind];
        write(storage.drafts, all);
      }
      function clearDraft(kind) {
        const all = read(storage.drafts, {});
        delete all[kind];
        write(storage.drafts, all);
      }

      function parseTime(value) {
        if (!value) return null;
        const direct = new Date(value);
        if (!Number.isNaN(direct.getTime())) return direct;
        const m = String(value).match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
        if (!m) return null;
        return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0));
      }

      function toDisplayTime(value) {
        const date = parseTime(value);
        if (!date) return String(value).slice(0, 16);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      function relativeTime(value) {
        const date = parseTime(value);
        if (!date) return "";
        const diff = Date.now() - date.getTime();
        if (diff < 0) return "";
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return "刚刚";
        if (mins < 60) return `${mins} 分钟前`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs} 小时前`;
        const days = Math.floor(hrs / 24);
        if (days < 30) return `${days} 天前`;
        const months = Math.floor(days / 30);
        if (months < 12) return `${months} 个月前`;
        return `${Math.floor(months / 12)} 年前`;
      }

      function formatTimeHtml(value) {
        const abs = toDisplayTime(value);
        const rel = relativeTime(value);
        const label = rel || abs;
        return `<time title="${safe(abs)}">${safe(label)}</time>`;
      }

      async function fetchShared(kind) {
        if (!cloudEnabled) return [];
        const response = await fetch(`${API_POSTS}?kind=${encodeURIComponent(kind)}`, { headers: { "Accept": "application/json" } });
        if (!response.ok) throw new Error("fetch failed");
        const data = await response.json();
        return (data.posts || []).map((item) => ({
          id: item.id,
          time: toDisplayTime(item.created_at),
          text: item.content || "",
          reply: item.reply || ""
        }));
      }

      async function createShared(kind, content, contact = "") {
        if (!cloudEnabled) throw new Error("cloud disabled");
        const headers = { "Content-Type": "application/json", "Accept": "application/json" };
        const key = getAuthorKey();
        if (key) headers["x-author-key"] = key;
        const response = await fetch(API_POSTS, {
          method: "POST",
          headers,
          body: JSON.stringify({ kind, content, contact })
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          const error = new Error(data.error || "submit failed");
          error.status = response.status;
          throw error;
        }
        const data = await response.json();
        return {
          id: data.post.id,
          time: toDisplayTime(data.post.created_at),
          text: data.post.content || ""
        };
      }

      async function deleteShared(id) {
        if (!cloudEnabled) throw new Error("cloud disabled");
        const headers = { "Accept": "application/json" };
        const key = getAuthorKey();
        if (key) headers["x-author-key"] = key;
        const response = await fetch(`${API_POSTS}?id=${encodeURIComponent(id)}`, { method: "DELETE", headers });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          const error = new Error(data.error || "delete failed");
          error.status = response.status;
          throw error;
        }
        return true;
      }

      function deleteErrorMessage(err) {
        if (err && err.status === 401) return "作者密钥无效，无法删除。请重新登录作者。";
        if (err && err.status === 503) return "服务器未配置作者密钥（AUTHOR_KEY）。";
        return "云端暂不可用，删除失败，请稍后再试。";
      }

      function actionErrorMessage(err, action) {
        if (err && err.status === 401) return `作者密钥无效，无法${action}。请重新登录作者。`;
        if (err && err.status === 503) return "服务器未配置作者密钥（AUTHOR_KEY）。";
        if (err && err.status === 400) return `${action}内容过长或格式有误。`;
        return `云端暂不可用，${action}失败，请稍后再试。`;
      }

      async function replyShared(id, reply) {
        if (!cloudEnabled) throw new Error("cloud disabled");
        const headers = { "Content-Type": "application/json", "Accept": "application/json" };
        const key = getAuthorKey();
        if (key) headers["x-author-key"] = key;
        const response = await fetch(`${API_POSTS}?id=${encodeURIComponent(id)}`, {
          method: "PUT",
          headers,
          body: JSON.stringify({ reply })
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          const error = new Error(data.error || "reply failed");
          error.status = response.status;
          throw error;
        }
        return true;
      }

      // Keep the localStorage cache in sync after a local mutation so the next
      // instant-load reflects the change instead of briefly showing stale data.
      function lightenEchoForCache(items) {
        return items.map((e) => ({
          id: e.id,
          title: e.title,
          body: e.body,
          date: e.date,
          thumb: e.thumb && e.thumb.startsWith("http") ? e.thumb : "",
          image: e.image && e.image.startsWith("http") ? e.image : "",
          personal: !!e.personal,
        }));
      }

      function writeEchoCache(items) {
        try {
          const light = lightenEchoForCache(items || []);
          if (JSON.stringify(light).length > 400000) return;
          write(storage.cache.echoes, light);
        } catch {}
      }

      function cacheShared(kind) {
        if (kind === "whisper" && sharedWhispers) write(storage.cache.whispers, sharedWhispers);
        if (kind === "letter" && sharedLetters) write(storage.cache.letters, sharedLetters);
        if (kind === "echo" && sharedEchoes) writeEchoCache(sharedEchoes);
      }

      function startReplyLetter(id) {
        replyingLetterId = id;
        renderAbout();
        requestAnimationFrame(() => {
          const el = document.getElementById("replyInput");
          if (el) el.focus();
        });
      }

      function cancelReplyLetter() {
        replyingLetterId = null;
        renderAbout();
      }

      async function submitReplyLetter(id) {
        const el = document.getElementById("replyInput");
        const statusEl = document.getElementById("replyStatus");
        const reply = el ? el.value.trim() : "";
        const letter = (sharedLetters || []).find((item) => item.id === id);
        if (statusEl) statusEl.textContent = "正在保存回复...";
        try {
          await replyShared(id, reply);
          if (letter) letter.reply = reply;
          cacheShared("letter");
          replyingLetterId = null;
          renderAbout();
        } catch (err) {
          if (statusEl) statusEl.textContent = actionErrorMessage(err, "回复");
        }
      }

      function showMoreLetters() {
        lettersVisible += 12;
        renderAbout();
      }

      async function runMigrate() {
        if (!isAuthor() || migrating) return;
        if (!window.confirm("将旧版 base64 图片迁移到 R2？已迁移的条目会自动跳过。")) return;
        migrating = true;
        renderAbout();
        const statusEl = document.getElementById("migrateStatus");
        if (statusEl) statusEl.textContent = "正在迁移，请稍候...";
        try {
          const response = await fetch(API_MIGRATE, {
            method: "POST",
            headers: { "Accept": "application/json", "x-author-key": getAuthorKey() },
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "migrate failed");
          if (statusEl) statusEl.textContent = `迁移完成：${data.migrated} 条已迁移，${data.skipped} 条跳过，${data.errors} 条失败。`;
          sharedEchoes = null;
          loadEchoes();
        } catch (err) {
          if (statusEl) statusEl.textContent = err.message || "迁移失败，请稍后再试。";
        } finally {
          migrating = false;
          renderAbout();
        }
      }

      async function deleteWhisper(id) {
        if (!window.confirm("确定删除这条呢喃？删除后无法恢复。")) return;
        try {
          await deleteShared(id);
          sharedWhispers = (sharedWhispers || []).filter((item) => item.id !== id);
          cacheShared("whisper");
          renderWhispers();
        } catch (err) { window.alert(deleteErrorMessage(err)); }
      }

      async function deleteEcho(id) {
        if (!window.confirm("确定删除这条回响（含照片）？删除后无法恢复。")) return;
        try {
          await deleteShared(id);
          sharedEchoes = (sharedEchoes || []).filter((item) => item.id !== id);
          writeEchoCache(sharedEchoes);
          go("echoes");
        } catch (err) { window.alert(deleteErrorMessage(err)); }
      }

      async function deleteLetter(id) {
        if (!window.confirm("确定删除这条留言？删除后无法恢复。")) return;
        try {
          await deleteShared(id);
          sharedLetters = (sharedLetters || []).filter((item) => item.id !== id);
          cacheShared("letter");
          renderAbout();
        } catch (err) { window.alert(deleteErrorMessage(err)); }
      }

      // Parse a raw list of fetchShared items into the echo shape used by the UI.
      function parseEchoItems(items) {
        return items.map(item => {
          try {
            const parsed = JSON.parse(item.text);
            return {
              id: item.id,
              title: parsed.title || "未命名",
              body: parsed.body || "",
              date: parsed.date || item.time,
              thumb: parsed.thumb || "",
              image: parsed.image || "",
              personal: false
            };
          } catch {
            return { id: item.id, title: "回响", body: item.text, date: item.time, thumb: "", image: "", personal: false };
          }
        });
      }

      // Stale-while-revalidate loader: on first load this session, show cached
      // data instantly, then revalidate ONCE in the background. The
      // `sharedX || loadingX` guard means later re-renders never re-fetch.
      function loadWhispers() {
        if (sharedWhispers || loadingWhispers) return;
        const cached = read(storage.cache.whispers, null);
        if (cached) {
          sharedWhispers = cached;
          if (tab === "whispers") renderWhispers();
          fetchShared("whisper").then((items) => {
            if (JSON.stringify(items) !== JSON.stringify(sharedWhispers)) {
              sharedWhispers = items;
              write(storage.cache.whispers, items);
              if (tab === "whispers") renderWhispers();
            }
          }).catch(() => {});
          return;
        }
        loadingWhispers = true;
        fetchShared("whisper")
          .then((items) => { sharedWhispers = items; write(storage.cache.whispers, items); })
          .catch(() => { sharedWhispers = []; })
          .finally(() => { loadingWhispers = false; if (tab === "whispers") renderWhispers(); });
      }

      function loadLetters() {
        if (sharedLetters || loadingLetters) return;
        const cached = read(storage.cache.letters, null);
        if (cached) {
          sharedLetters = cached;
          if (tab === "about") renderAbout();
          fetchShared("letter").then((items) => {
            if (JSON.stringify(items) !== JSON.stringify(sharedLetters)) {
              sharedLetters = items;
              write(storage.cache.letters, items);
              if (tab === "about") renderAbout();
            }
          }).catch(() => {});
          return;
        }
        loadingLetters = true;
        fetchShared("letter")
          .then((items) => { sharedLetters = items; write(storage.cache.letters, items); })
          .catch(() => { sharedLetters = []; })
          .finally(() => { loadingLetters = false; if (tab === "about") renderAbout(); });
      }

      // Echo cache stores only lightweight metadata (http URLs, no base64 blobs).
      function revalidateEchoes() {
        fetchShared("echo")
          .then((items) => {
            const parsed = parseEchoItems(items);
            if (JSON.stringify(parsed) !== JSON.stringify(sharedEchoes)) {
              sharedEchoes = parsed;
              writeEchoCache(sharedEchoes);
              if (tab === "echoes") renderEchoes();
            }
            echoesError = false;
          })
          .catch(() => {
            echoesError = !sharedEchoes || !sharedEchoes.length;
            if (tab === "echoes") renderEchoes();
          });
      }

      function loadEchoes() {
        if (sharedEchoes || loadingEchoes) return;
        const cached = read(storage.cache.echoes, null);
        if (cached !== null && Array.isArray(cached)) {
          sharedEchoes = cached;
          if (tab === "echoes") renderEchoes();
          revalidateEchoes();
          return;
        }
        loadingEchoes = true;
        echoesError = false;
        fetchShared("echo")
          .then((items) => {
            sharedEchoes = parseEchoItems(items);
            writeEchoCache(sharedEchoes);
          })
          .catch(() => { sharedEchoes = []; echoesError = true; })
          .finally(() => { loadingEchoes = false; if (tab === "echoes") renderEchoes(); });
      }

      // Manual retry after a failed echo load. The load guard treats the
      // post-failure [] as "already loaded", so a user-initiated reset is the
      // only way to re-fetch without a full page reload.
      function retryEchoes() {
        sharedEchoes = null;
        echoesError = false;
        loadEchoes();
        renderEchoes();
      }

      function enter() {
        const entrance = document.querySelector(".entrance");
        if (entrance) entrance.classList.add("hide");
        setTimeout(() => { location.hash = "whispers"; }, 680);
      }

      const TABS = ["whispers", "echoes", "about"];
      function parseHash() {
        const raw = location.hash.replace(/^#\/?/, "");
        if (!raw) return null;
        const [name, sub] = raw.split("/");
        if (name === "echoes") return { tab: "echoes", echo: sub !== undefined && sub !== "" ? Number(sub) : null };
        if (TABS.includes(name)) return { tab: name, echo: null };
        return null;
      }
      function applyRoute() {
        const route = parseHash();
        if (!route) { activeEcho = null; renderEntrance(); return; }
        tab = route.tab;
        activeEcho = tab === "echoes" && Number.isInteger(route.echo) ? route.echo : null;
        renderApp();
      }

      function renderEntrance() {
        root.innerHTML = `
          <section class="entrance stage">
            <div class="entrance-center">
              <img class="hero-image" src="${images.entrance}" alt="低饱和静谧风景">
              <p class="entrance-copy serif">有缘人得见，这里是我的赛博自留地。</p>
            </div>
            <button class="ghost-button serif" onclick="enter()">[ 步入树洞 ]</button>
          </section>
        `;
      }

      function shell(content) {
        root.innerHTML = `
          <div class="app fade">
            <nav class="nav">
              <div class="nav-inner">
                <button class="nav-back serif" onclick="goBack()" aria-label="返回上一级">‹<span class="nav-back-text"> 返回</span></button>
                <button class="${tab === "whispers" ? "active" : ""}" onclick="switchTab('whispers')">呢喃墙</button>
                <button class="${tab === "echoes" ? "active" : ""}" onclick="switchTab('echoes')">光影与回响</button>
                <button class="${tab === "about" ? "active" : ""}" onclick="switchTab('about')">留白与信箱</button>
              </div>
            </nav>
            ${content}
          </div>
        `;
      }
      function switchTab(next) { go(next); }
      // Visible "up one level" control — needed in the installed PWA, which has
      // no browser chrome. Echo detail → echo grid; any tab → entrance.
      function goBack() {
        if (tab === "echoes" && activeEcho !== null) { go("echoes"); return; }
        location.hash = "";
      }
      // Navigate by URL hash so the browser back button and refresh both work.
      // Re-render explicitly when the hash would not actually change.
      function go(hash) {
        if (location.hash === "#" + hash) applyRoute();
        else location.hash = hash;
      }

      function renderApp() {
        if (tab === "whispers") renderWhispers();
        if (tab === "echoes") renderEchoes();
        if (tab === "about") renderAbout();
      }

      function renderWhispers() {
        loadWhispers();
        const localItems = read(storage.whispers, []);
        const publicItems = sharedWhispers || [];
        const items = [...publicItems, ...localItems];
        shell(`
          <main class="narrow fade">
            ${isAuthor() ? `
            <form id="whisperForm">
              <textarea id="whisperText" rows="3" placeholder="这一刻你在想什么...">${safe(loadDraft("whisper").text || "")}</textarea>
              <button class="ghost-button serif" type="submit">[ 记下 ]</button>
            </form>` : ""}
            <p class="status-line" id="whisperStatus">${loadingWhispers && !sharedWhispers ? "正在读取云端呢喃..." : ""}</p>
            ${isAuthor() && localItems.length ? `<button class="ghost-button serif" onclick="clearWhispers()">[ 清空本机缓存记录 ]</button>` : ""}
            <section class="timeline">
              ${items.map(item => `<article class="fade">${formatTimeHtml(item.time)}<p class="serif">${safe(item.text)}</p>${isAuthor() && item.id ? `<button class="ghost-button serif" onclick="deleteWhisper(${item.id})">[ 删除 ]</button>` : ""}</article>`).join("")}
            </section>
          </main>
        `);
        const whisperForm = document.getElementById("whisperForm");
        const whisperText = document.getElementById("whisperText");
        if (whisperText) whisperText.oninput = () => saveDraft("whisper", { text: whisperText.value });
        if (whisperForm) whisperForm.onsubmit = async (event) => {
          event.preventDefault();
          const value = document.getElementById("whisperText").value.trim();
          if (!value) return;
          const status = document.getElementById("whisperStatus");
          status.textContent = "正在写入云端...";
          try {
            const created = await createShared("whisper", value);
            sharedWhispers = [created, ...(sharedWhispers || [])];
            cacheShared("whisper");
            clearDraft("whisper");
            autoBackup();
            renderWhispers();
          } catch (err) {
            if (err && (err.status === 401 || err.status === 503)) {
              status.textContent = err.status === 401 ? "作者密钥无效，无法发布。请重新登录作者。" : "服务器未配置作者密钥（AUTHOR_KEY）。";
              return;
            }
            write(storage.whispers, [{ time: stamp(), text: value }, ...localItems]);
            renderWhispers();
            requestAnimationFrame(() => {
              const nextStatus = document.getElementById("whisperStatus");
              if (nextStatus) nextStatus.textContent = "云端暂不可用，已保存在本机。";
            });
          }
        };
      }
      function clearWhispers() { write(storage.whispers, []); renderWhispers(); }

      function allEchoes() {
        const local = read(storage.echoes, []);
        const publicItems = sharedEchoes || [];
        return [...publicItems, ...local, ...defaultEchoes];
      }
      function renderEchoes() {
        const items = allEchoes();
        loadEchoes();  // 加载云端回响
        if (activeEcho !== null) {
          const item = items[activeEcho];
          if (item) {
            // Full photo is fetched on demand; show the thumb meanwhile.
            if (!item.image && item.id) fetchEchoImage(item.id, item);
            const loadingImage = !item.image && !!item.id;
            shell(`
              <main class="reader fade">
                <button class="ghost-button serif" onclick="go('echoes')">[ 返回 ]</button>
                ${isAuthor() && item.id ? `<button class="ghost-button serif" onclick="deleteEcho(${item.id})">[ 删除 ]</button>` : ""}
                ${item.personal ? `<button class="ghost-button serif" onclick="removeEcho(${activeEcho})">[ 移除 ]</button>` : ""}
                <div class="reader-image"><img src="${safe(safeImage(item.image || item.thumb))}" alt="${safe(item.title || "回响照片")}"></div>
                ${loadingImage ? `<p class="status-line">正在载入原图...</p>` : ""}
                ${formatTimeHtml(item.date)}${item.personal ? `<span class="status-line"> · 仅本机未同步</span>` : ""}
                <h1 class="serif">${safe(item.title)}</h1>
                <p class="reader-body serif">${safe(item.body)}</p>
              </main>
            `);
            return;
          }
          // Detail not available yet. If echoes are still loading (e.g. a
          // deep-linked /echoes/N on refresh), keep activeEcho so loadEchoes
          // re-renders into the detail; otherwise drop to the grid.
          if (!loadingEchoes) activeEcho = null;
        }
        shell(`
          <main class="fade">
            ${isAuthor() ? `
            <form class="echo-form" id="echoForm">
              <label class="photo-picker serif" id="photoPicker">
                <span>[ 选一张照片 ]</span>
                <input id="echoPhoto" type="file" accept="image/*">
              </label>
              <div class="echo-fields">
                <input id="echoTitle" placeholder="给这束光一个标题..." value="${safe(loadDraft("echo").title || "")}">
                <textarea id="echoBody" rows="4" placeholder="留下它当时的回响...">${safe(loadDraft("echo").body || "")}</textarea>
                <button class="ghost-button serif" type="submit">[ 收进回响 ]</button>
              </div>
            </form>` : ""}
            <p class="status-line" id="echoStatus">${loadingEchoes && !sharedEchoes ? "正在读取云端回响..." : (echoesError ? "云端暂不可用，回响未能载入。" : "")}</p>
            ${(!loadingEchoes && echoesError)
              ? `<button class="ghost-button serif" onclick="retryEchoes()">[ 重新加载 ]</button>`
              : ""}
            ${(!loadingEchoes && !echoesError && items.length === 0)
              ? `<p class="status-line serif">这里还没有回响。${isAuthor() ? "选一张照片，收进第一束光。" : ""}</p>`
              : ""}
            <section class="grid">
              ${items.map((item, index) => `
                <button class="card fade" onclick="go('echoes/${index}')">
                  <div class="card-frame"><img loading="lazy" src="${safe(safeImage(item.thumb || item.image))}" alt="${safe(item.title || "回响照片")}"></div>
                  <h2 class="serif">${safe(item.title)}</h2>
                  ${formatTimeHtml(item.date)}${item.personal ? `<span class="status-line"> · 仅本机未同步</span>` : ""}
                </button>
              `).join("")}
            </section>
          </main>
        `);

        // Photo picker — compress before keeping the photo so it can sync to cloud.
        const photoInput = document.getElementById("echoPhoto");
        if (photoInput) {
          const onPhoto = async (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const picker = document.getElementById("photoPicker");
            const prev = picker.innerHTML;
            picker.innerHTML = `<span>[ 正在压缩照片... ]</span>`;
            try {
              draftPhoto = await compressImage(file);
            } catch {
              try { draftPhoto = await readFileAsDataUrl(file); }
              catch { draftPhoto = ""; }
            }
            if (!draftPhoto) { picker.innerHTML = prev; return; }
            picker.innerHTML = `<img src="${safe(draftPhoto)}" alt=""><input id="echoPhoto" type="file" accept="image/*">`;
            const newInput = picker.querySelector("input");
            if (newInput) newInput.onchange = onPhoto;
          };
          photoInput.onchange = onPhoto;
        }

        // Keep the title/body draft so a refresh mid-compose doesn't lose words.
        const echoTitleEl = document.getElementById("echoTitle");
        const echoBodyEl = document.getElementById("echoBody");
        const saveEchoDraft = () => saveDraft("echo", {
          title: echoTitleEl ? echoTitleEl.value : "",
          body: echoBodyEl ? echoBodyEl.value : ""
        });
        if (echoTitleEl) echoTitleEl.oninput = saveEchoDraft;
        if (echoBodyEl) echoBodyEl.oninput = saveEchoDraft;

        // Submit handler with cloud support
        const echoForm = document.getElementById("echoForm");
        if (echoForm) {
          echoForm.onsubmit = async (event) => {
            event.preventDefault();
            const title = document.getElementById("echoTitle").value.trim() || "未命名的回响";
            const body = document.getElementById("echoBody").value.trim() || "这一张照片暂时不需要解释。";
            const status = document.getElementById("echoStatus");
            if (status) status.textContent = "正在收进回响...";

            const imageData = draftPhoto || images.entrance;
            const thumb = await makeThumb(imageData);

            try {
              // Upload photo to R2 first; store only the public URL in D1.
              // This removes the 1 MB content cap and preserves original quality.
              let imageUrl = imageData; // fallback: inline base64 if R2 unavailable
              if (status) status.textContent = "正在上传照片到云端...";
              try {
                imageUrl = await uploadPhotoToR2(imageData);
              } catch (uploadErr) {
                if (uploadErr.status === 401 || uploadErr.status === 503) {
                  if (status) status.textContent = uploadErr.status === 401 ? "作者密钥无效，无法发布。请重新登录作者。" : "服务器未配置作者密钥（AUTHOR_KEY）。";
                  return;
                }
                // R2 not configured or temporarily down — fall back to inline base64.
              }
              if (status) status.textContent = "正在收进回响...";
              const echoContent = JSON.stringify({ title, body, image: imageUrl, thumb });
              const created = await createShared("echo", echoContent);
              sharedEchoes = [{ id: created.id, title, body, date: day(), thumb, image: imageUrl, personal: false }, ...(sharedEchoes || [])];
              writeEchoCache(sharedEchoes);
              draftPhoto = "";
              clearDraft("echo");
              autoBackup();
              if (status) status.textContent = "已收进云端回响！";
              setTimeout(() => renderEchoes(), 800);
            } catch (err) {
              if (err && (err.status === 401 || err.status === 503)) {
                if (status) status.textContent = err.status === 401 ? "作者密钥无效，无法发布。请重新登录作者。" : "服务器未配置作者密钥（AUTHOR_KEY）。";
                return;
              }
              const custom = read(storage.echoes, []);
              write(storage.echoes, [{ title, body, date: day(), image: imageData, personal: true }, ...custom]);
              draftPhoto = "";
              if (status) status.textContent = "云端暂不可用，仅保存在本机（其他设备看不到）。";
              setTimeout(() => renderEchoes(), 800);
            }
          };
        }
      }

      function removeEcho(index) {
        // `index` points into the combined list [public..., local..., default...].
        // Only local echoes are removable, so map back to the local array.
        const publicCount = (sharedEchoes || []).length;
        const localIndex = index - publicCount;
        const custom = read(storage.echoes, []);
        if (localIndex < 0 || localIndex >= custom.length) { go("echoes"); return; }
        write(storage.echoes, custom.filter((_, itemIndex) => itemIndex !== localIndex));
        go("echoes");
      }

      function letterArticleHtml(letter) {
        const id = letter.id;
        const editing = isAuthor() && id && replyingLetterId === id;
        const replyControls = isAuthor() && id
          ? (editing
              ? `<span class="letter-reply-form">
                   <textarea id="replyInput" rows="3" placeholder="回复这条留言（留空保存即删除回复）">${safe(letter.reply || "")}</textarea>
                   <button class="ghost-button serif" onclick="submitReplyLetter(${id})">[ 保存 ]</button>
                   <button class="ghost-button serif" onclick="cancelReplyLetter()">[ 取消 ]</button>
                   <span id="replyStatus" class="status-line"></span>
                 </span>`
              : `<button class="ghost-button serif" onclick="startReplyLetter(${id})">[ ${letter.reply ? "编辑回复" : "回复"} ]</button>`)
          : "";
        return `<article>
          ${formatTimeHtml(letter.time)}
          <p class="serif">${safe(letter.text || letter.message || "")}</p>
          ${letter.reply && !editing ? `<p class="serif letter-reply">树洞回复：${safe(letter.reply)}</p>` : ""}
          ${replyControls}
          ${isAuthor() && id ? `<button class="ghost-button serif" onclick="deleteLetter(${id})">[ 删除 ]</button>` : ""}
        </article>`;
      }

      function renderAbout() {
        loadLetters();
        const localLetters = read(storage.letters, []);
        const publicLetters = sharedLetters || [];
        const letters = [...publicLetters, ...localLetters];
        const visibleLetters = letters.slice(0, lettersVisible);
        shell(`
          <main class="narrow fade">
            <p class="about-copy serif">这个域名暂时不承担身份，也不承担作品集。它只是我在网络深处留出的一小块暗房，用来存放不急着被理解的句子、照片和沉默。</p>
            <form class="mailbox" id="mailForm">
              <textarea class="field-box" id="mailMessage" rows="5" placeholder="想对树洞说的话...">${safe(loadDraft("letter").message || "")}</textarea>
              <input class="field-box" id="mailContact" placeholder="你的联系方式（选填，若需回信）" value="${safe(loadDraft("letter").contact || "")}">
              <button class="ghost-button serif" type="submit">[ 投递 ]</button>
              <p id="mailStatus" class="status-line">${loadingLetters && !sharedLetters ? "正在读取云端留言..." : ""}</p>
            </form>
            ${letters.length ? `<section class="letter-list">${visibleLetters.map(letterArticleHtml).join("")}${letters.length > lettersVisible ? `<button class="ghost-button serif" onclick="showMoreLetters()">[ 加载更多留言 ]</button>` : ""}</section>` : ""}
            <section class="backup">
              <button class="ghost-button serif" onclick="exportBackup()">[ 导出备份 ]</button>
              <label class="ghost-button serif">[ 导入备份 ]<input class="sr-only" id="backupInput" type="file" accept="application/json"></label>
              <span id="backupStatus" class="status-line">${backupAgeLabel()}</span>
              ${isAuthor()
                ? `<button class="ghost-button serif" onclick="runMigrate()" ${migrating ? "disabled" : ""}>[ 迁移旧图片到 R2 ]</button>
                   <span id="migrateStatus" class="status-line"></span>
                   <button class="ghost-button serif" onclick="logoutAuthor()">[ 退出作者 ]</button>`
                : (authPrompting
                    ? `<span class="author-login">
                         <input id="authKeyInput" type="text" inputmode="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="输入作者密钥" />
                         <button class="ghost-button serif" onclick="submitAuthorKey()">[ 确定 ]</button>
                         <button class="ghost-button serif" onclick="cancelAuthor()">[ 取消 ]</button>
                         <span id="authStatus" class="status-line"></span>
                       </span>`
                    : `<button class="ghost-button serif" onclick="promptAuthor()">[ 作者登录 ]</button>`)}
            </section>
          </main>
        `);
        const authKeyInput = document.getElementById("authKeyInput");
        if (authKeyInput) {
          authKeyInput.focus();
          authKeyInput.onkeydown = (event) => { if (event.key === "Enter") { event.preventDefault(); submitAuthorKey(); } };
        }
        const replyInput = document.getElementById("replyInput");
        if (replyInput) {
          replyInput.focus();
          replyInput.onkeydown = (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
              event.preventDefault();
              submitReplyLetter(replyingLetterId);
            }
          };
        }
        const mailMessageEl = document.getElementById("mailMessage");
        const mailContactEl = document.getElementById("mailContact");
        const saveLetterDraft = () => saveDraft("letter", {
          message: mailMessageEl ? mailMessageEl.value : "",
          contact: mailContactEl ? mailContactEl.value : ""
        });
        if (mailMessageEl) mailMessageEl.oninput = saveLetterDraft;
        if (mailContactEl) mailContactEl.oninput = saveLetterDraft;
        document.getElementById("mailForm").onsubmit = async (event) => {
          event.preventDefault();
          const message = document.getElementById("mailMessage").value.trim();
          const contact = document.getElementById("mailContact").value.trim();
          if (!message && !contact) return;
          const letter = { time: stamp(), message, contact };
          const status = document.getElementById("mailStatus");
          status.textContent = "正在写入云端...";
          try {
            const created = await createShared("letter", message || "（无正文）", contact);
            sharedLetters = [created, ...(sharedLetters || [])];
            cacheShared("letter");
            clearDraft("letter");
            autoBackup();
            document.getElementById("mailStatus").textContent = "已放进树洞。";
            setTimeout(renderAbout, 700);
          } catch {
            write(storage.letters, [letter, ...localLetters]);
            document.getElementById("mailStatus").textContent = "云端暂不可用，已保存在本机。";
            setTimeout(renderAbout, 900);
          }
        };
        document.getElementById("backupInput").onchange = importBackup;
      }
      // A lightweight snapshot (text + metadata, no full photos) written after
      // every successful publish, so a cleared cache or lost device still leaves
      // a recoverable trail. Kept small on purpose to stay within the localStorage
      // quota; full-resolution photos live in the cloud and the manual export.
      function autoBackup() {
        try {
          // Preserve sections that aren't loaded this session: a null shared
          // array means "unknown", not "empty". Without this, publishing in a
          // session where (say) letters were never opened would overwrite a
          // good backup's letters with an empty list.
          const prev = read("treehole.autobackup", {}) || {};
          const snap = {
            savedAt: new Date().toISOString(),
            whispers: sharedWhispers ? sharedWhispers.map((w) => ({ time: w.time, text: w.text })) : (prev.whispers || []),
            letters: sharedLetters ? sharedLetters.map((l) => ({ time: l.time, text: l.text, reply: l.reply || "" })) : (prev.letters || []),
            echoes: sharedEchoes ? sharedEchoes.map((e) => ({ title: e.title, body: e.body, date: e.date })) : (prev.echoes || [])
          };
          write("treehole.autobackup", snap);
          localStorage.setItem(storage.backupAt, snap.savedAt);
        } catch {}
      }

      function backupAgeLabel() {
        try {
          const at = localStorage.getItem(storage.backupAt);
          if (!at) return "";
          const diff = Date.now() - new Date(at).getTime();
          if (!Number.isFinite(diff) || diff < 0) return "";
          const mins = Math.floor(diff / 60000);
          if (mins < 1) return "刚刚已备份";
          if (mins < 60) return `上次备份 ${mins} 分钟前`;
          const hrs = Math.floor(mins / 60);
          if (hrs < 24) return `上次备份 ${hrs} 小时前`;
          return `上次备份 ${Math.floor(hrs / 24)} 天前`;
        } catch { return ""; }
      }

      // Manual export now captures the real content — the cloud posts, not just
      // the local-only fallback — and pulls each echo's full-resolution photo so
      // the file is a complete, portable archive.
      async function exportBackup() {
        const statusEl = document.getElementById("backupStatus");
        if (statusEl) statusEl.textContent = "正在打包备份...";
        const localWhispers = read(storage.whispers, []);
        const localLetters = read(storage.letters, []);
        const localEchoes = read(storage.echoes, []);

        const echoes = [];
        for (const e of (sharedEchoes || [])) {
          let image = e.image || "";
          if (!image && e.id && cloudEnabled) {
            try {
              const r = await fetch(`${API_POSTS}?id=${encodeURIComponent(e.id)}`, { headers: { "Accept": "application/json" } });
              if (r.ok) { const d = await r.json(); image = (JSON.parse(d.post.content).image) || ""; }
            } catch {}
          }
          echoes.push({ title: e.title, body: e.body, date: e.date, image: image || e.thumb || "" });
        }

        const data = JSON.stringify({
          exportedAt: new Date().toISOString(),
          whispers: [
            ...(sharedWhispers || []).map((w) => ({ time: w.time, text: w.text })),
            ...localWhispers
          ],
          echoes: [...echoes, ...localEchoes],
          letters: [
            ...(sharedLetters || []).map((l) => ({ time: l.time, text: l.text, reply: l.reply || "" })),
            ...localLetters
          ]
        }, null, 2);

        const url = URL.createObjectURL(new Blob([data], { type: "application/json;charset=utf-8" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = `treehole-backup-${day()}.json`;
        link.click();
        URL.revokeObjectURL(url);
        try { localStorage.setItem(storage.backupAt, new Date().toISOString()); } catch {}
        if (statusEl) statusEl.textContent = "备份已导出。";
      }
      function importBackup(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (Array.isArray(data.whispers)) write(storage.whispers, data.whispers);
            if (Array.isArray(data.echoes)) write(storage.echoes, data.echoes);
            if (Array.isArray(data.letters)) write(storage.letters, data.letters);
            renderApp();
          } catch {}
        };
        reader.readAsText(file, "utf-8");
      }

      // Prefetch cloud data while the entrance is visible so tabs feel instant.
      function prefetchCloudData() {
        if (!cloudEnabled) return;
        loadWhispers();
        loadEchoes();
        loadLetters();
      }
      prefetchCloudData();

      // The URL hash is the source of truth for which view is shown, so a
      // refresh stays on the current tab and the back button works.
      window.addEventListener("hashchange", applyRoute);
      applyRoute();

      // Register the service worker so the site can be installed to the home
      // screen and opened offline. Only over http(s); never on file://.
      if (cloudEnabled && "serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
